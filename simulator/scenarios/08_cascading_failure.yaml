id: "scenario-08-cascading-failure"
name: "Cascading Service Failure & Upstream Thread Starvation"
description: "High latency and blockage in payment-service stalls synchronous worker threads in order-service, which rapidly cascades connection saturation upstream to api-gateway."
category: "CASCADING_FAILURE"

topology:
  - name: "api-gateway"
    version: "v1.4"
    dependencies: ["order-service"]
    tier: "edge"
    environment: "production"
  - name: "order-service"
    version: "v3.0"
    dependencies: ["payment-service"]
    tier: "backend"
    environment: "production"
  - name: "payment-service"
    version: "v2.8"
    dependencies: []
    tier: "backend"
    environment: "production"

baseline_phase:
  name: "Normal System Operation"
  duration_seconds: 60
  request_rate: 160.0
  error_rate_percent: 0.0
  p50_latency_ms: 25.0
  p95_latency_ms: 70.0
  p99_latency_ms: 100.0
  cpu_percent: 30.0
  memory_percent: 45.0
  custom_metrics:
    - name: "threadpool.active"
      type: "GAUGE"
      value: 12.0
    - name: "threadpool.queue_depth"
      type: "GAUGE"
      value: 0.0
  logs: []
  traces: []

fault_phase:
  name: "Downstream Stall & Thread Exhaustion"
  duration_seconds: 120
  request_rate: 180.0
  error_rate_percent: 54.0
  p50_latency_ms: 1200.0
  p95_latency_ms: 4800.0
  p99_latency_ms: 6500.0
  cpu_percent: 94.0
  memory_percent: 88.0
  custom_metrics:
    - name: "threadpool.active"
      type: "GAUGE"
      value: 200.0
    - name: "threadpool.queue_depth"
      type: "GAUGE"
      value: 500.0
  logs:
    - severity: "ERROR"
      pattern: "[payment-service] Processing delay exceeded timeout window: duration=6500ms"
      count: 18
    - severity: "ERROR"
      pattern: "[order-service] java.util.concurrent.RejectedExecutionException: Thread pool queue capacity 500 reached"
      count: 24
      attributes:
        exception.type: "RejectedExecutionException"
    - severity: "ERROR"
      pattern: "[api-gateway] Upstream connection pool saturated while calling order-service. HTTP 503."
      count: 30
  traces: []

recovery_phase:
  name: "Circuit Breakers Tripped & Latency Reset"
  duration_seconds: 60
  request_rate: 160.0
  error_rate_percent: 0.0
  p50_latency_ms: 28.0
  p95_latency_ms: 75.0
  p99_latency_ms: 105.0
  cpu_percent: 32.0
  memory_percent: 48.0
  custom_metrics:
    - name: "threadpool.active"
      type: "GAUGE"
      value: 14.0
    - name: "threadpool.queue_depth"
      type: "GAUGE"
      value: 0.0
  logs: []
  traces: []

ground_truth:
  expected_incident: true
  expected_severity: "SEV1"
  root_service: "payment-service"
  root_cause_category: "CASCADING_FAILURE"
  blast_radius_services:
    - "payment-service"
    - "order-service"
    - "api-gateway"
  expected_hypotheses:
    - "Cascading failure triggered by downstream stall in payment-service"
    - "Thread pool exhaustion in order-service"
  min_confidence: 0.75
  explanation: "Downstream latency stall in payment-service caused thread exhaustion in order-service, propagating connection saturation to api-gateway."
