id: "scenario-05-network-degradation"
name: "Network Degradation & Socket Read Timeouts"
description: "Packet loss and latency jitter between api-gateway and user-service cause TCP retransmission spikes and java.net.SocketTimeoutException."
category: "NETWORK_DEGRADATION"

topology:
  - name: "api-gateway"
    version: "v1.4"
    dependencies: ["user-service"]
    tier: "edge"
    environment: "production"
  - name: "user-service"
    version: "v2.1"
    dependencies: []
    tier: "backend"
    environment: "production"

baseline_phase:
  name: "Clean Network Transmission"
  duration_seconds: 60
  request_rate: 150.0
  error_rate_percent: 0.0
  p50_latency_ms: 12.0
  p95_latency_ms: 35.0
  p99_latency_ms: 55.0
  cpu_percent: 25.0
  memory_percent: 38.0
  custom_metrics:
    - name: "network.tcp.retrans.rate"
      type: "GAUGE"
      value: 0.02
    - name: "network.packet.drop.rate"
      type: "GAUGE"
      value: 0.0
  logs: []
  traces: []

fault_phase:
  name: "Packet Loss & Socket Timeouts"
  duration_seconds: 90
  request_rate: 160.0
  error_rate_percent: 38.0
  p50_latency_ms: 650.0
  p95_latency_ms: 2900.0
  p99_latency_ms: 4500.0
  cpu_percent: 45.0
  memory_percent: 48.0
  custom_metrics:
    - name: "network.tcp.retrans.rate"
      type: "GAUGE"
      value: 18.5
    - name: "network.packet.drop.rate"
      type: "GAUGE"
      value: 12.4
  logs:
    - severity: "ERROR"
      pattern: "java.net.SocketTimeoutException: Read timed out after 5000ms connecting to user-service"
      count: 22
      attributes:
        exception.type: "java.net.SocketTimeoutException"
        remote.host: "user-service"
    - severity: "WARN"
      pattern: "[api-gateway] TCP connection reset by peer on egress route /api/users"
      count: 14
    - severity: "ERROR"
      pattern: "HTTP 504 Gateway Timeout on upstream request to user-service"
      count: 18
  traces: []

recovery_phase:
  name: "Network Route Repaired"
  duration_seconds: 60
  request_rate: 150.0
  error_rate_percent: 0.0
  p50_latency_ms: 14.0
  p95_latency_ms: 38.0
  p99_latency_ms: 58.0
  cpu_percent: 26.0
  memory_percent: 40.0
  custom_metrics:
    - name: "network.tcp.retrans.rate"
      type: "GAUGE"
      value: 0.04
  logs: []
  traces: []

ground_truth:
  expected_incident: true
  expected_severity: "SEV2"
  root_service: "api-gateway"
  root_cause_category: "NETWORK_DEGRADATION"
  blast_radius_services:
    - "api-gateway"
    - "user-service"
  expected_hypotheses:
    - "Network degradation and socket read timeout between api-gateway and user-service"
    - "TCP retransmission surge"
  min_confidence: 0.70
  explanation: "Network link between gateway and user-service experienced heavy packet loss and socket read timeouts resulting in HTTP 504s."
