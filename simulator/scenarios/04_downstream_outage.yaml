id: "scenario-04-downstream-outage"
name: "Downstream Service Complete Outage"
description: "Inventory-service crashes completely due to process termination, returning HTTP 503 and Connection Refused errors upstream to order-service."
category: "DOWNSTREAM_OUTAGE"

topology:
  - name: "api-gateway"
    version: "v1.4"
    dependencies: ["order-service"]
    tier: "edge"
    environment: "production"
  - name: "order-service"
    version: "v3.0"
    dependencies: ["inventory-service"]
    tier: "backend"
    environment: "production"
  - name: "inventory-service"
    version: "v1.9"
    dependencies: []
    tier: "backend"
    environment: "production"

baseline_phase:
  name: "All Downstreams Healthy"
  duration_seconds: 60
  request_rate: 140.0
  error_rate_percent: 0.0
  p50_latency_ms: 20.0
  p95_latency_ms: 55.0
  p99_latency_ms: 85.0
  cpu_percent: 30.0
  memory_percent: 40.0
  custom_metrics: []
  logs: []
  traces: []

fault_phase:
  name: "Downstream Crash & Connection Refused"
  duration_seconds: 90
  request_rate: 140.0
  error_rate_percent: 92.0
  p50_latency_ms: 1200.0
  p95_latency_ms: 4500.0
  p99_latency_ms: 5000.0
  cpu_percent: 15.0
  memory_percent: 20.0
  custom_metrics:
    - name: "downstream.endpoint.up"
      type: "GAUGE"
      value: 0.0
      labels:
        service: "inventory-service"
  logs:
    - severity: "ERROR"
      pattern: "java.net.ConnectException: Connection refused: inventory-service:8080"
      count: 25
      attributes:
        exception.type: "java.net.ConnectException"
        downstream.service: "inventory-service"
    - severity: "FATAL"
      pattern: "[inventory-service] SIGTERM received, terminating main event loop"
      count: 2
    - severity: "ERROR"
      pattern: "HTTP 503 Service Unavailable returned by downstream inventory-service"
      count: 20
  traces: []

recovery_phase:
  name: "Service Pod Rescheduled"
  duration_seconds: 60
  request_rate: 140.0
  error_rate_percent: 0.0
  p50_latency_ms: 22.0
  p95_latency_ms: 58.0
  p99_latency_ms: 88.0
  cpu_percent: 32.0
  memory_percent: 42.0
  custom_metrics:
    - name: "downstream.endpoint.up"
      type: "GAUGE"
      value: 1.0
  logs: []
  traces: []

ground_truth:
  expected_incident: true
  expected_severity: "SEV1"
  root_service: "inventory-service"
  root_cause_category: "DOWNSTREAM_OUTAGE"
  blast_radius_services:
    - "inventory-service"
    - "order-service"
    - "api-gateway"
  expected_hypotheses:
    - "Downstream outage in inventory-service"
    - "Connection refused 503"
  min_confidence: 0.75
  explanation: "Inventory-service crashed, causing 92% failure rate with Connection Refused errors cascading upstream."
