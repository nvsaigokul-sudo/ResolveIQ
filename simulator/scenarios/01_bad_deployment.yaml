id: "scenario-01-bad-deployment"
name: "Canonical Demo - Bad Deployment Connection Pool Exhaustion"
description: "Deployment of payment-service v2.8 introduces an unclosed database transaction, causing HikariCP connection pool exhaustion, cascading 500 errors to order-service and api-gateway."
category: "DEPLOYMENT_REGRESSION"

topology:
  - name: "api-gateway"
    version: "v1.4"
    dependencies: ["user-service", "order-service"]
    tier: "edge"
    environment: "production"
  - name: "user-service"
    version: "v2.1"
    dependencies: []
    tier: "backend"
    environment: "production"
  - name: "order-service"
    version: "v3.0"
    dependencies: ["payment-service", "inventory-service"]
    tier: "backend"
    environment: "production"
  - name: "payment-service"
    version: "v2.8"
    dependencies: []
    tier: "backend"
    environment: "production"
  - name: "inventory-service"
    version: "v1.9"
    dependencies: ["notification-service"]
    tier: "backend"
    environment: "production"
  - name: "notification-service"
    version: "v1.2"
    dependencies: []
    tier: "worker"
    environment: "production"

deployment:
  service: "payment-service"
  version: "v2.8"
  commit_sha: "d7a4b81"
  commit_message: "Optimize transaction processing and retry mechanism"
  author: "developer@resolveiq.io"
  offset_seconds: -180
  status: "SUCCESS"

baseline_phase:
  name: "Nominal Operations"
  duration_seconds: 60
  request_rate: 150.0
  error_rate_percent: 0.0
  p50_latency_ms: 22.0
  p95_latency_ms: 65.0
  p99_latency_ms: 95.0
  cpu_percent: 28.0
  memory_percent: 42.0
  custom_metrics:
    - name: "db.pool.active_connections"
      type: "GAUGE"
      value: 6.0
      labels:
        pool: "HikariPool-1"
        service: "payment-service"
    - name: "db.pool.pending_threads"
      type: "GAUGE"
      value: 0.0
      labels:
        pool: "HikariPool-1"
        service: "payment-service"
  logs: []
  traces: []

fault_phase:
  name: "Connection Pool Exhaustion"
  duration_seconds: 120
  request_rate: 180.0
  error_rate_percent: 42.5
  p50_latency_ms: 320.0
  p95_latency_ms: 1850.0
  p99_latency_ms: 2950.0
  cpu_percent: 78.0
  memory_percent: 85.0
  custom_metrics:
    - name: "db.pool.active_connections"
      type: "GAUGE"
      value: 30.0
      labels:
        pool: "HikariPool-1"
        service: "payment-service"
    - name: "db.pool.pending_threads"
      type: "GAUGE"
      value: 48.0
      labels:
        pool: "HikariPool-1"
        service: "payment-service"
    - name: "db.pool.idle_connections"
      type: "GAUGE"
      value: 0.0
      labels:
        pool: "HikariPool-1"
        service: "payment-service"
  logs:
    - severity: "ERROR"
      pattern: "HikariPool-1 - Connection is not available, request timed out after 30000ms."
      count: 12
      attributes:
        exception.type: "java.sql.SQLTransientConnectionException"
        db.pool.name: "HikariPool-1"
    - severity: "ERROR"
      pattern: "org.postgresql.util.PSQLException: FATAL: remaining connection slots are reserved for non-replication superuser connections"
      count: 6
      attributes:
        exception.type: "org.postgresql.util.PSQLException"
        db.system: "postgresql"
    - severity: "ERROR"
      pattern: "[payment-service] Failed to acquire DB connection for transaction execution"
      count: 15
      attributes:
        http.status_code: 500
  traces: []

recovery_phase:
  name: "Rollback to v2.7"
  duration_seconds: 60
  request_rate: 150.0
  error_rate_percent: 0.0
  p50_latency_ms: 24.0
  p95_latency_ms: 68.0
  p99_latency_ms: 98.0
  cpu_percent: 30.0
  memory_percent: 45.0
  custom_metrics:
    - name: "db.pool.active_connections"
      type: "GAUGE"
      value: 7.0
      labels:
        pool: "HikariPool-1"
        service: "payment-service"
    - name: "db.pool.pending_threads"
      type: "GAUGE"
      value: 0.0
      labels:
        pool: "HikariPool-1"
        service: "payment-service"
  logs: []
  traces: []

ground_truth:
  expected_incident: true
  expected_severity: "SEV1"
  root_service: "payment-service"
  root_cause_category: "DEPLOYMENT_REGRESSION"
  blast_radius_services:
    - "payment-service"
    - "order-service"
    - "api-gateway"
  expected_hypotheses:
    - "Deployment regression in payment-service v2.8 exhausted HikariCP database connection pool"
    - "Database connection pool timeout"
  min_confidence: 0.75
  explanation: "Payment-service v2.8 deployment caused HikariCP connection pool exhaustion with 42.5% 500 errors and p99 latency > 2500ms, cascading to order-service and api-gateway."
