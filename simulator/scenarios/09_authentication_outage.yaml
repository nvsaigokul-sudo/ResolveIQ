id: "scenario-09-authentication-outage"
name: "Authentication Outage & JWKS Verification Failure"
description: "Auth-service fails during key rotation, making the JWKS public endpoint unreachable and causing api-gateway to reject all inbound user tokens with HTTP 401 Unauthorized."
category: "SECURITY_AUTH_FAILURE"

topology:
  - name: "api-gateway"
    version: "v1.4"
    dependencies: ["auth-service"]
    tier: "edge"
    environment: "production"
  - name: "auth-service"
    version: "v2.0"
    dependencies: []
    tier: "backend"
    environment: "production"

baseline_phase:
  name: "Nominal Token Verification"
  duration_seconds: 60
  request_rate: 200.0
  error_rate_percent: 0.0
  p50_latency_ms: 10.0
  p95_latency_ms: 25.0
  p99_latency_ms: 45.0
  cpu_percent: 20.0
  memory_percent: 35.0
  custom_metrics:
    - name: "auth.jwt.verification_success"
      type: "COUNTER"
      value: 12000.0
  logs: []
  traces: []

fault_phase:
  name: "JWKS Endpoint Unreachable & Token Verification Spikes 401"
  duration_seconds: 90
  request_rate: 210.0
  error_rate_percent: 96.0
  p50_latency_ms: 50.0
  p95_latency_ms: 350.0
  p99_latency_ms: 800.0
  cpu_percent: 42.0
  memory_percent: 50.0
  custom_metrics:
    - name: "auth.jwt.verification_failure"
      type: "COUNTER"
      value: 18900.0
  logs:
    - severity: "ERROR"
      pattern: "com.auth0.jwt.exceptions.JWTVerificationException: Failed to fetch JWKS public key set from auth-service: /.well-known/jwks.json"
      count: 28
      attributes:
        exception.type: "JWTVerificationException"
    - severity: "ERROR"
      pattern: "[api-gateway] Rejected request due to signature verification failure: HTTP 401 Unauthorized"
      count: 45
    - severity: "ERROR"
      pattern: "[auth-service] Key rotation failed: unable to write new keystore credentials"
      count: 5
  traces: []

recovery_phase:
  name: "JWKS Endpoint Restored"
  duration_seconds: 60
  request_rate: 200.0
  error_rate_percent: 0.0
  p50_latency_ms: 11.0
  p95_latency_ms: 28.0
  p99_latency_ms: 48.0
  cpu_percent: 22.0
  memory_percent: 36.0
  custom_metrics: []
  logs: []
  traces: []

ground_truth:
  expected_incident: true
  expected_severity: "SEV1"
  root_service: "auth-service"
  root_cause_category: "SECURITY_AUTH_FAILURE"
  blast_radius_services:
    - "auth-service"
    - "api-gateway"
  expected_hypotheses:
    - "Authentication outage caused by JWKS validation failure in auth-service"
    - "HTTP 401 token signature verification failure"
  min_confidence: 0.75
  explanation: "Auth-service key rotation failure caused JWKS endpoint outage, leading to 96% token verification rejections across the API gateway."
