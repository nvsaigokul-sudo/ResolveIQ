server:
  port: -1

spring:
  application:
    name: resolveiq-backend-test
  datasource:
    url: jdbc:h2:mem:resolveiq_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        show_sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  flyway:
    enabled: false

resolveiq:
  jwt:
    secret: this-is-a-test-secret-key-that-is-at-least-32-chars-long-for-testing
    issuer: resolveiq-test
    expiration-minutes: 15

logging:
  level:
    com.resolveiq: DEBUG
