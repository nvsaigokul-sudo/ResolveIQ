server:
  port: 8080

spring:
  application:
    name: resolveiq-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/resolveiq}
    username: ${DATABASE_USERNAME:resolveiq_app}
    password: ${DATABASE_PASSWORD:resolveiq_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ResolveIQHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: resolveiq-incident-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

resolveiq:
  jwt:
    secret: ${RESOLVEIQ_JWT_SECRET:production-grade-jwt-secret-key-for-resolveiq-platform-secure-token}
    issuer: resolveiq-auth
    expiration-minutes: 15
  kafka:
    topics:
      incidents: incidents
      incident-events: incident.events
      evidence: telemetry.evidence

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
